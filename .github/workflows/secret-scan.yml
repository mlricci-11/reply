name: secret-scan

# This repo is PUBLIC: anything pushed is world-readable at once. gitleaks (the same release and sha256 as mj-ops and
# mj-ops-scripts) scans the CURRENT TREE on every pull request and every push to main. Values are redacted in the log.
# It deploys nothing. A reviewed false positive goes in .gitleaks.toml with its reason.
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: gitleaks v8.21.2 (working tree)
        run: |
          curl -sSfL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner
