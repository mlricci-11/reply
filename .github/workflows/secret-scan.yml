name: secret-scan

# This repo is PUBLIC: anything pushed is world-readable at once, on any branch, and stays readable in history.
# So gitleaks scans EVERY commit (history included) on every push to any branch and on every pull request.
# A failure names the file, line and rule; the value itself is redacted in the log. It deploys nothing.
# Same gitleaks release and sha256 as mj-ops secret-scan.yml and mj-ops-scripts checks.yml: change all three together.
# The default rules do not know every vendor's key format: never put any key or hook URL here, whatever the scan says.
# A finding that was rotated stays in history and keeps every run red: put its fingerprint (from the log) in
# .gitleaksignore with the rotation date.
on:
  pull_request:
  workflow_dispatch:
  push:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks v8.21.2 (every commit)
        run: |
          curl -sSfL --retry 3 --retry-all-errors https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --verbose --no-banner
